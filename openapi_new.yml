openapi: '3.0.3'
info:
  title: Catalog Api
  version: '1.0.0'
  description: This is the catalog API
  contact:
    name: soeren.firlus
    email: soeren.firlus@dataport.de
    url: soeren-firlus.com
servers:
  - url: https://localhost:50001
tags:
  - name: Shop
  - name: ShopDetail
paths:
  /articles:
    get:
      operationId: listArticles
      tags:
        - Shop
      summary: Get all articles
      description: Responds with all articles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseArticle'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorMsg'
        'default':
          description: DefaultResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMsg'
    post:
      operationId: createArticle
      summary: Create an article
      description: Will create an new article
      tags:
        - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestArticle'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticle'
  /articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id of the article
        schema:
          type: string
          format: uuid
          maxLength: 36
    get:
      operationId: getArticle
      summary: Get an article by aid
      description: Responds with an specific article
      tags:
        - Shop
        - ShopDetail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticle'
    put:
      operationId: replaceArticle
      summary: Replace an article
      description: Will replace all values of an article
      tags:
        - Shop
        - ShopDetail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPutArticle'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticle'
    patch:
      operationId: updateArticle
      summary: Update an article
      description: Will update an existing article
      tags:
        - Shop
        - ShopDetail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPatchArticle'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticle'
    delete:
      operationId: deleteArticle
      summary: Delete an article
      description: Will delete an new article
      tags:
        - Shop
        - ShopDetail
      responses:
        '200':
          description: Deleted
components:
  schemas:
    ErrorMsg:
      type: object
      description: Problem Details for HTTP APIs (RFC 9457)
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI reference identifying the problem type
          example: https://example.com/problems/article-not-found
        title:
          type: string
          description: Short, human-readable summary of the problem type
          example: Article not found
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: No article with id 3fa85f64-5717-4562-b3fc-2c963f66afa6 exists
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence
          example: /articles/3fa85f64-5717-4562-b3fc-2c963f66afa6
      additionalProperties: true
    RequestArticle:
      type: object
      properties:
        name:
          type: string
          maxLength: 70
          description: Name of the article
      required:
        - name
    RequestPutArticle:
      type: object
      properties:
        name:
          type: string
          maxLength: 70
          description: Name of the article
        price:
          type: number
          format: float
          minimum: 0
          description: This is the price of the article
          example: 0.99
      required:
        - name
    RequestPatchArticle:
      type: object
      properties:
        name:
          type: string
          maxLength: 70
          description: Name of the article
        price:
          type: number
          format: float
          minimum: 0
          description: This is the price of the article
          example: 0.99
    ResponseArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          maxLength: 70
          description: Name of the article        
        price:
          type: number
          format: float
          minimum: 0
          description: This is the price of the article
          example: 0.99
      required:
        - id
        - name
    


